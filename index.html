<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RHODA V6.4 LIVE SCREEN - SAME DEVICE MT5</title>
<style>
body{margin:0;background:#0a0e1a;color:#fff;font-family:Arial;text-align:center}
#top{padding:12px;background:#111a2e}
button{padding:14px 20px;margin:8px;border:none;border-radius:10px;font-weight:bold;font-size:15px}
#startScreen{background:#7c3aed;color:#fff;width:90%}
#recBtn{background:#ef4444;color:#fff;width:44%}
#stopBtn{background:#222;color:#aaa;width:44%}
#videoBox{width:95%;margin:10px auto;background:#000;border:2px solid #7c3aed;border-radius:12px;position:relative}
video{width:100%;border-radius:10px}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#status{padding:10px;color:#22c55e;font-weight:bold}
</style>
</head>
<body>
<div id="top">
<h3>RHODA TRUTH V6.4<br>LIVE SCREENING ON SAME SCREEN</h3>
<p>MT5 Live on THIS phone - No second device</p>
<button id="startScreen">🖥️ START LIVE SCREENING OF THIS SCREEN</button>
<div>
<button id="recBtn">● REC LIVE SCREEN</button>
<button id="stopBtn">⏹️ STOP ALL</button>
</div>
<div id="status">Ready - Tap START</div>
</div>

<div id="videoBox">
<video id="liveVideo" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
</div>

<p>Procedure: START → Allow Entire Screen → Open MT5 app → Return here → MT5 LIVE here → REC</p>

<script>
let screenStream, mediaRecorder, recordedChunks=[];
const video = document.getElementById('liveVideo');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

document.getElementById('startScreen').onclick = async () => {
 try{
  screenStream = await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:"monitor"},audio:false});
  video.srcObject = screenStream;
  status.innerHTML = "🔴 LIVE SCREEN ACTIVE - Now open MT5 app, then come back";
  status.style.color = "#22c55e";
  // resize canvas
  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    drawOverlay();
  };
  screenStream.getVideoTracks()[0].onended = () => { status.innerHTML="Screen sharing ended"; };
 }catch(e){ alert("Failed: "+e.message+"\nUse Chrome, and Allow screen"); }
};

function drawOverlay(){
 // Example overlay dots - your strategy
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="rgba(34,197,94,0.8)";
 // Simulate BUY dot - you replace with your logic
 ctx.beginPath();
 ctx.arc(canvas.width*0.5, canvas.height*0.5, 15, 0, Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#fff"; ctx.font="20px Arial"; ctx.fillText("BUY LIVE SCREEN MT5", 20, 40);
 requestAnimationFrame(drawOverlay);
}

document.getElementById('recBtn').onclick = () => {
 if(!screenStream){ alert("Start screen first!"); return; }
 recordedChunks=[];
 mediaRecorder = new MediaRecorder(screenStream, {mimeType:'video/webm'});
 mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
 mediaRecorder.onstop = ()=>{
   const blob = new Blob(recordedChunks, {type:'video/webm'});
   const url = URL.createObjectURL(blob);
   const a = document.createElement('a'); a.href=url; a.download='RHODA-LIVE-SCREEN-MT5.webm'; a.click();
   status.innerHTML="✅ Recording saved - LIVE SCREEN MT5 recorded on this screen";
 };
 mediaRecorder.start();
 status.innerHTML="● RECORDING LIVE SCREEN MT5...";
};

document.getElementById('stopBtn').onclick = () => {
 if(mediaRecorder && mediaRecorder.state=="recording") mediaRecorder.stop();
 if(screenStream) screenStream.getTracks().forEach(t=>t.stop());
 video.srcObject=null;
 status.innerHTML="Stopped";
};
</script>
</body>
 </html>
