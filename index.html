<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RHODA V10.5 FULL MT5 CLONE - WORKING</title><script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#bbb;height:100vh;display:flex;flex-direction:column;overflow:hidden}#top{height:36px;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 8px;font-size:11px;gap:6px;flex-shrink:0}#mainArea{flex:1;display:flex;flex-direction:column;background:#000;overflow:hidden}.chartBox{background:#000;border-bottom:1px solid #222;position:relative}#boxMain{flex:2.2;min-height:180px}#boxVol{flex:0.7;min-height:60px}#boxBulls{flex:0.7;min-height:60px}#boxMFI{flex:0.7;min-height:60px}#bottomNav{height:48px;background:#000;border-top:1px solid #222;display:flex;flex-shrink:0}.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#666}.navBtn.active{color:#2196f3}.navBtn b{font-size:14px}#panel{position:absolute;inset:36px 0 48px 0;background:#000;z-index:30;display:none;overflow-y:auto;padding:0}#panel.open{display:block}.card{background:#111;border:1px solid #222;padding:10px;margin-bottom:1px}input,textarea,select{background:#111;border:1px solid #333;color:#ddd;padding:7px;border-radius:4px;width:100%;margin-top:5px;font-size:12px}.btn{background:#2196f3;color:#fff;border:none;padding:7px 10px;border-radius:4px;margin:3px 2px;font-size:11px}.btn.red{background:#c62828}.btn.green{background:#2e7d32}.btn.gray{background:#333}.btn.orange{background:#ff9800;color:#000;font-weight:700}.strategyRow{display:flex;align-items:center;gap:4px;padding:6px;background:#1a1a1a;border-bottom:1px solid #222;font-size:11px;flex-wrap:wrap}#watch{position:absolute;top:36px;left:0;bottom:48px;width:0;background:#000;border-right:1px solid #222;overflow-y:auto;transition:0.2s;z-index:20}#watch.open{width:180px}.watch-item{padding:8px;border-bottom:1px solid #111;font-size:11px;display:flex;justify-content:space-between;cursor:pointer}#alarmBanner{position:fixed;top:40px;left:10px;right:10px;background:#ff9800;color:#000;padding:10px;border-radius:8px;display:none;z-index:9999;text-align:center;font-weight:700;font-size:12px}.qHeader{height:30px;background:#111;display:flex;align-items:center;padding:0 8px;font-size:11px;border-bottom:1px solid #222}.pairCheck{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.pairCheck label{display:flex;align-items:center;gap:3px;background:#1a1a1a;border:1px solid #333;padding:4px 7px;border-radius:12px;font-size:10px;cursor:pointer}.pairCheck input{width:auto}</style></head><body><div id="top"><span onclick="toggleWatch()" style="font-size:18px">☰</span><span id="symLabel" style="color:#fff;font-weight:700">BTC • M5 Bitcoin - LOADING</span><span style="flex:1"></span><span id="srcLabel" style="font-size:8px;color:#888">SRC:TRY</span><span id="alarmTop" style="color:#ff9800;font-size:10px">🔔 ON</span><span id="sleepTop" style="color:#00e676;font-size:10px">🔆 ON</span><span id="clock" style="font-size:10px">--:--</span></div><div id="watch"></div><div id="alarmBanner"></div><div id="mainArea"><div class="chartBox" id="boxMain"><div id="cMain" style="width:100%;height:100%"></div></div><div class="chartBox" id="boxVol"><div id="cVol" style="width:100%;height:100%"></div></div><div class="chartBox" id="boxBulls"><div id="cBulls" style="width:100%;height:100%"></div></div><div class="chartBox" id="boxMFI"><div id="cMFI" style="width:100%;height:100%"></div></div></div><div id="panel"></div><div id="bottomNav"><div class="navBtn" onclick="showTab('quotes')"><b>⇅</b>Quotes</div><div class="navBtn active" id="navCharts" onclick="showTab('charts')"><b>📈</b>Charts</div><div class="navBtn" onclick="showTab('trades')"><b>💰</b><span id="tradeBal">324.30</span></div><div class="navBtn" onclick="showTab('history')"><b>🕘</b>History</div><div class="navBtn" id="navMessages" onclick="showTab('messages')"><b>✉️</b>Messages</div></div><script>
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString()},1000);
let alarmOn=localStorage.getItem('rhoda_alarm')!=='false',noSleepOn=localStorage.getItem('rhoda_nosleep')!=='false',wakeLock=null,noSleepEnabled=noSleepOn;

async function enableWakeLock(){if(!noSleepEnabled) return;try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch{}}document.addEventListener('visibilitychange',()=>{if(wakeLock!==null&&document.visibilityState==='visible'&&noSleepEnabled) enableWakeLock();});if(noSleepOn) enableWakeLock();setInterval(()=>{if(noSleepEnabled&&!wakeLock) enableWakeLock();},10000);updateTopIcons();

let chartMain,chartVol,chartBulls,chartMFI,candleSeries,ma7,ma25,ma99,volSeries,bullsSeries,bearsSeries,mfiSeries;
function initCharts(){
 try{
  let el1=document.getElementById('cMain'),el2=document.getElementById('cVol'),el3=document.getElementById('cBulls'),el4=document.getElementById('cMFI');
  chartMain=LightweightCharts.createChart(el1,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},timeScale:{borderColor:'#222'},rightPriceScale:{borderColor:'#222'},width:el1.clientWidth||window.innerWidth,height:el1.clientHeight||180});
  chartVol=LightweightCharts.createChart(el2,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},timeScale:{visible:false,borderColor:'#222'},rightPriceScale:{borderColor:'#222'},width:el2.clientWidth||window.innerWidth,height:el2.clientHeight||60});
  chartBulls=LightweightCharts.createChart(el3,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},timeScale:{visible:false,borderColor:'#222'},rightPriceScale:{borderColor:'#222'},width:el3.clientWidth||window.innerWidth,height:el3.clientHeight||60});
  chartMFI=LightweightCharts.createChart(el4,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},timeScale:{borderColor:'#222',timeVisible:true},rightPriceScale:{borderColor:'#222'},width:el4.clientWidth||window.innerWidth,height:el4.clientHeight||60});
  candleSeries=chartMain.addCandlestickSeries({upColor:'#00ff00',downColor:'#ff0000'});ma7=chartMain.addLineSeries({color:'#ffff00',lineWidth:1});ma25=chartMain.addLineSeries({color:'#ff00ff',lineWidth:1});ma99=chartMain.addLineSeries({color:'#00ffff',lineWidth:1});volSeries=chartVol.addHistogramSeries({color:'#26a69a'});bullsSeries=chartBulls.addLineSeries({color:'#ff0000',lineWidth:1});bearsSeries=chartBulls.addLineSeries({color:'#00ffff',lineWidth:1});mfiSeries=chartMFI.addLineSeries({color:'#2979ff',lineWidth:1});
  genDummy();connectWithFallback();
 }catch(e){showBanner('Chart error: '+e.message);}
}
function genDummy(){let now=Math.floor(Date.now()/1000),price=77953,cs=[];for(let i=100;i>=0;i--){let o=price+(Math.random()-0.5)*100,c=o+(Math.random()-0.5)*80,h=Math.max(o,c)+20,l=Math.min(o,c)-20;cs.push({time:now-i*300,open:o,high:h,low:l,close:c});price=c;}candles=cs;updateAll();}
let candles=[],priceLines=[],currentSymbol='cryBTCUSD',currentLabel='BTC',simInterval=null,currentSource='SIM';
const SYMBOL_MAP=[{label:'BTC',sym:'cryBTCUSD'},{label:'ETH',sym:'cryETHUSD'},{label:'XAUUSD',sym:'frxXAUUSD'},{label:'XAGUSD',sym:'frxXAGUSD'},{label:'EURUSD',sym:'frxEURUSD'},{label:'GBPUSD',sym:'frxGBPUSD'},{label:'VOL75',sym:'R_75'},{label:'BOOM500',sym:'BOOM500'},{label:'CRASH500',sym:'CRASH500'}];
let watch=document.getElementById('watch');SYMBOL_MAP.forEach(s=>{let d=document.createElement('div');d.className='watch-item';d.innerHTML=`<div><b>${s.label}</b><div style="font-size:9px;color:#666">${s.sym}</div></div><div style="text-align:right;color:#ff5252" id="p_${s.sym}">--</div>`;d.onclick=()=>{currentSymbol=s.sym;currentLabel=s.label;document.getElementById('symLabel').textContent=s.label+' • M5';connectWithFallback();toggleWatch();showTab('charts');};watch.appendChild(d);});function toggleWatch(){watch.classList.toggle('open')}
function calcEMA(data,period){let k=2/(period+1),ema=[],sum=0;for(let i=0;i<data.length;i++){if(i<period-1){sum+=data[i];ema.push(null);continue;}if(i===period-1){sum+=data[i];ema.push(sum/period);}else{ema.push(data[i]*k+ema[i-1]*(1-k));}}return ema;}
function calcBullsBears(high,low,close,period){let ema=calcEMA(close,period),bulls=[],bears=[];for(let i=0;i<close.length;i++){if(ema[i]===null){bulls.push(null);bears.push(null);}else{bulls.push(high[i]-ema[i]);bears.push(low[i]-ema[i]);}}return {bulls,bears};}
function calcMFI(high,low,close,vol,period){let tp=[];for(let i=0;i<close.length;i++) tp.push((high[i]+low[i]+close[i])/3);let mf=[];for(let i=0;i<tp.length;i++) mf.push(tp[i]*(vol[i]||1));let mfi=[];for(let i=0;i<close.length;i++){if(i<period){mfi.push(null);continue;}let pos=0,neg=0;for(let j=i-period+1;j<=i;j++){if(j===0) continue;if(tp[j]>tp[j-1]) pos+=mf[j];else if(tp[j]<tp[j-1]) neg+=mf[j];}if(neg===0) mfi.push(100);else{let mr=pos/neg;mfi.push(100-(100/(1+mr)));}}return mfi;}
function startSim(){if(simInterval) clearInterval(simInterval);currentSource='SIM MOVING - Not stagnant';document.getElementById('srcLabel').textContent='SRC:SIM';document.getElementById('srcLabel').style.color='#ff9800';showBanner('SIM moving - Chart WILL move even if Deriv blocked in your area');simInterval=setInterval(()=>{let last=candles[candles.length-1];if(!last) return;let change=(Math.random()-0.5)*30,newClose=last.close+change,epoch=Math.floor(Date.now()/1000);epoch=epoch-(epoch%300);let nc={time:epoch,open:last.open,high:Math.max(last.high,newClose),low:Math.min(last.low,newClose),close:newClose};if(nc.time===last.time) candles[candles.length-1]=nc;else{candles.push(nc);if(candles.length>300) candles.shift();}updateAll();},1500);}
function connectWithFallback(){
 if(simInterval){clearInterval(simInterval);simInterval=null;}
 let sources=[{name:'Deriv1',url:'wss://ws.binaryws.com/websockets/v3?app_id=1089'},{name:'Deriv2',url:'wss://ws.derivws.com/websockets/v3?app_id=1089'}];
 let idx=0;
 function tryNext(){
  if(idx>=sources.length){startSim();return;}
  let src=sources[idx];document.getElementById('srcLabel').textContent='SRC:TRY '+src.name;showBanner('Trying '+src.name+'...');
  try{
   let ws=new WebSocket(src.url);let to=setTimeout(()=>{ws.close();idx++;tryNext();},4000);
   ws.onopen=()=>{clearTimeout(to);ws.send(JSON.stringify({ticks_history:currentSymbol,adjust_start_time:1,count:300,end:'latest',granularity:300,style:'candles'}));ws.send(JSON.stringify({ticks:currentSymbol,subscribe:1}));document.getElementById('srcLabel').textContent='SRC:'+src.name+' LIVE';document.getElementById('srcLabel').style.color='#00e676';showBanner(src.name+' CONNECTED - Live');};
   ws.onmessage=(e)=>{let data=JSON.parse(e.data);if(data.candles){candles=data.candles.map(c=>({time:c.epoch,open:c.open,high:c.high,low:c.low,close:c.close}));updateAll();}if(data.tick){let t=data.tick,newClose=parseFloat(t.quote),last=candles[candles.length-1];if(!last) return;let epoch=t.epoch-(t.epoch%300),nc={time:epoch,open:last.open,high:Math.max(last.high,newClose),low:Math.min(last.low,newClose),close:newClose};if(nc.time===last.time) candles[candles.length-1]=nc;else{candles.push(nc);if(candles.length>300) candles.shift();}updateAll();let el=document.getElementById('p_'+t.symbol);if(el) el.textContent=newClose.toFixed(2);}};
   ws.onerror=()=>{clearTimeout(to);ws.close();idx++;tryNext();};ws.onclose=()=>{setTimeout(()=>{if(idx<sources.length){idx++;tryNext();}},1000);};
  }catch{idx++;tryNext();}
 }
 tryNext();
}
function updateAll(){if(candles.length===0||!candleSeries) return;candleSeries.setData(candles);let close=candles.map(c=>c.close),high=candles.map(c=>c.high),low=candles.map(c=>c.low);let e7=calcEMA(close,7),e25=calcEMA(close,25),e99=calcEMA(close,99),d7=[],d25=[],d99=[];for(let i=0;i<candles.length;i++){if(e7[i]!==null) d7.push({time:candles[i].time,value:e7[i]});if(e25[i]!==null) d25.push({time:candles[i].time,value:e25[i]});if(e99[i]!==null) d99.push({time:candles[i].time,value:e99[i]});}ma7.setData(d7);ma25.setData(d25);ma99.setData(d99);let volData=candles.map(c=>({time:c.time,value:Math.abs(c.close-c.open)*1000+Math.random()*50,color:c.close>=c.open?'#00ff00':'#ff0000'}));volSeries.setData(volData);let bb=calcBullsBears(high,low,close,20),bD=[],beD=[];for(let i=0;i<candles.length;i++){if(bb.bulls[i]!==null){bD.push({time:candles[i].time,value:bb.bulls[i]});beD.push({time:candles[i].time,value:bb.bears[i]});}}bullsSeries.setData(bD);bearsSeries.setData(beD);let mfi=calcMFI(high,low,close,volData.map(v=>v.value),14),mD=[];for(let i=0;i<candles.length;i++){if(mfi[i]!==null) mD.push({time:candles[i].time,value:mfi[i]});}mfiSeries.setData(mD);try{chartMain.timeScale().fitContent();chartVol.timeScale().fitContent();chartBulls.timeScale().fitContent();chartMFI.timeScale().fitContent();}catch{}document.getElementById('symLabel').textContent=currentLabel+' • M5 Bitcoin '+close[close.length-1].toFixed(2)+' - '+currentSource;runStrategies();}
let strategies=JSON.parse(localStorage.getItem('rhoda_v8_strats')||'[]'),trades=JSON.parse(localStorage.getItem('rhoda_v8_trades')||'[]'),history=JSON.parse(localStorage.getItem('rhoda_v8_history')||'[]');
function triggerAlarm(name,side,sym){if(!alarmOn) return;showBanner(`🔔 ${side} ${sym} ${name}`);if(navigator.vibrate) navigator.vibrate([600,150,600,150,800]);let a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');a.play().catch(()=>{});if(Notification.permission==='granted'){new Notification(`RHODA ${side} ${sym}`,{body:name});}}
function runStrategies(){if(candles.length<30) return;priceLines.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});priceLines=[];let closes=candles.map(c=>c.close),markers=[];strategies.filter(s=>s.enabled&&!s.stopped).forEach(s=>{if(s.pairs&&s.pairs.length>0&&!s.pairs.includes(currentSymbol)) return;try{let fn=new Function('candles',s.code+'; return typeof check==="function"? check(candles):{};');let res=fn(closes);if(res.levels){Object.entries(res.levels).forEach(([k,v])=>{if(typeof v==='number'){let pl=candleSeries.createPriceLine({price:v,color:s.color||'#ff9800',title:k+' '+s.name,lineWidth:1,lineStyle:2});priceLines.push(pl);}});}if(res.sl){let pl=candleSeries.createPriceLine({price:res.sl,color:'#f44336',title:'SL',lineWidth:2});priceLines.push(pl);}if(res.tp){let pl=candleSeries.createPriceLine({price:res.tp,color:'#00e676',title:'TP',lineWidth:2});priceLines.push(pl);}if(res.buy||res.sell){let side=res.buy?'BUY':'SELL';markers.push({time:candles[candles.length-1].time,position:res.buy?'belowBar':'aboveBar',color:res.buy?'#00e676':'#ff1744',shape:res.buy?'arrowUp':'arrowDown',text:side});let t={time:Date.now(),symbol:currentSymbol,label:currentLabel,name:s.name,side,price:closes[closes.length-1]};trades.push(t);history.push({...t,profit:0});localStorage.setItem('rhoda_v8_trades',JSON.stringify(trades));localStorage.setItem('rhoda_v8_history',JSON.stringify(history));triggerAlarm(s.name,side,currentLabel);}}catch{}});if(markers.length) candleSeries.setMarkers(markers.slice(-50));}
function showTab(tab){let p=document.getElementById('panel');document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));if(tab==='quotes'){p.classList.remove('open');toggleWatch();return;}if(tab==='charts'){p.classList.remove('open');document.getElementById('navCharts').classList.add('active');resizeAll();return;}p.classList.add('open');if(tab==='trades'){document.querySelectorAll('.navBtn')[2].classList.add('active');renderTrades();}if(tab==='history'){document.querySelectorAll('.navBtn')[3].classList.add('active');renderHistory();}if(tab==='messages'){document.getElementById('navMessages').classList.add('active');renderMessages();}}function closePanel(){document.getElementById('panel').classList.remove('open');document.getElementById('navCharts').classList.add('active');resizeAll();}function getSelectedPairs(){let checks=document.querySelectorAll('.pair-cb:checked');return Array.from(checks).map(c=>c.value);}
function renderMessages(){let h=`<div class="qHeader"><span>Messages - Strategy, Alarm, No Sleep, Fibs, Lines - Multi Pair</span></div><div class="card"><h4 style="color:#ff9800">🔔 ALARM CONTROL - Background + Screen Asleep - ON/OFF</h4><div style="display:flex;gap:6px;margin-top:8px"><button class="btn ${alarmOn?'green':'gray'}" onclick="toggleAlarm()" style="flex:1">${alarmOn?'🔔 ALARM ON':'🔕 ALARM OFF'}</button><button class="btn ${noSleepOn?'green':'gray'}" onclick="toggleNoSleep()" style="flex:1">${noSleepOn?'🔆 NO-SLEEP ON':'💤 NO-SLEEP OFF'}</button></div><button class="btn orange" onclick="testAlarm()" style="width:100%;margin-top:6px">TEST ALARM - Vibrate + Sound + Banner</button><div style="font-size:10px;color:#888;margin-top:4px">Current: ${currentSource} - Alarm ON = rings even if phone screen is looking asleep with off and on button yes. As long as internet ON. No-Sleep ON = phone will NOT sleep.</div></div><div class="card"><h4 style="color:#00e676">📋 STRATEGY CONTROL - Choose pairs after paste - ALL pairs allowed - 1000 max</h4><p style="font-size:10px;color:#888">PASTE STRATEGY HERE</p><textarea id="code" rows="6" placeholder="function check(candles){ let last=candles[candles.length-1]; let high=Math.max(...candles.slice(-20)); let low=Math.min(...candles.slice(-20)); let range=high-low; let lvl125=low+range*1.25; let lvl75=low+range*0.75; if(last>=lvl125) return {sell:true, levels:{'125%':lvl125,'75%':lvl75}}; return {levels:{'125%':lvl125,'75%':lvl75}} }"></textarea><div style="margin-top:6px"><b>COPY SYMBOL PROCESS - Select pairs for this strategy:</b><div class="pairCheck">${SYMBOL_MAP.map(s=>`<label><input type="checkbox" class="pair-cb" value="${s.sym}" checked> ${s.label}</label>`).join('')}</div><div style="display:flex;gap:5px;margin-top:4px"><button class="btn gray" onclick="document.querySelectorAll('.pair-cb').forEach(c=>c.checked=true)">SELECT ALL PAIRS</button><button class="btn gray" onclick="document.querySelectorAll('.pair-cb').forEach(c=>c.checked=false)">DESELECT ALL</button></div></div><div style="display:flex;gap:5px;margin-top:6px"><input id="sname" placeholder="Name e.g. BTC Bulls Bears 125 75"><input id="scolor" type="color" value="#ff9800" style="width:50px"></div><button class="btn green" onclick="saveStrat()">SAVE STRATEGY WITH PAIRS - 1000 max</button><div style="font-size:10px;color:#666;margin-top:4px">Total: ${strategies.length}/1000 - withdraw = no line on chart</div><div id="list" style="margin-top:6px"></div></div><div class="card"><h4>📜 EXAMPLE 125% 75% CODE</h4><div style="background:#0a0a0a;border:1px solid #ff9800;padding:8px;font-family:monospace;font-size:10px;color:#00e676">function check(candles){let last=candles[candles.length-1];let high=Math.max(...candles.slice(-20));let low=Math.min(...candles.slice(-20));let range=high-low;let lvl125=low+range*1.25;let lvl75=low+range*0.75;if(last>=lvl125) return {sell:true, sl:high, tp:low, levels:{'125%':lvl125,'75%':lvl75}};if(last<=lvl75) return {buy:true, sl:low, tp:high, levels:{'125%':lvl125,'75%':lvl75}};return {levels:{'125%':lvl125,'75%':lvl75}}}</div></div><div class="card"><h4 style="color:#2196f3">📐 FIBS AND LINES WELL</h4><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn" onclick="toggleFib()">FIB ON/OFF - Tap 2 points</button><button class="btn gray" onclick="addHLine()">ADD H LINE</button><button class="btn gray" onclick="clearAllLines()">CLEAR ALL</button></div><p style="font-size:10px;color:#888">FIB draws 0%, 23.6%, 38.2%, 50%, 61.8%, 75%, 100%, 125%, 150% like MT5</p></div><button class="btn gray" onclick="closePanel()" style="width:100%;margin-top:10px">BACK TO MT5 CHART</button><br><br>`;document.getElementById('panel').innerHTML=h;let list=document.getElementById('list');list.innerHTML='';strategies.forEach(s=>{let r=document.createElement('div');r.className='strategyRow';let pairsTxt=(s.pairs||[]).map(p=>SYMBOL_MAP.find(m=>m.sym===p)?.label||p).join(',');r.innerHTML=`<input type="checkbox" ${s.enabled?'checked':''} onchange="toggleStrat(${s.id},this.checked)"> <b style="color:${s.color}">${s.name}</b> <span style="font-size:9px;color:#888">[${pairsTxt||'ALL'}]</span><span style="flex:1"></span><button class="btn gray" onclick="stopStrat(${s.id})">${s.stopped?'▶ CONT':'■ STOP'}</button><button class="btn red" onclick="delStrat(${s.id})">DEL</button>`;list.appendChild(r);});}
function saveStrat(){let c=document.getElementById('code').value,n=document.getElementById('sname').value||'Strat '+(strategies.length+1),co=document.getElementById('scolor').value,pairs=getSelectedPairs();if(!c) return alert('Paste code');if(strategies.length>=1000) return alert('Max 1000');strategies.push({id:Date.now(),name:n,code:c,color:co,enabled:true,stopped:false,pairs:pairs});localStorage.setItem('rhoda_v8_strats',JSON.stringify(strategies));renderMessages();runStrategies();showBanner('Saved for '+(pairs.length?pairs.join(','):'ALL'));}
function toggleStrat(id,v){let s=strategies.find(x=>x.id===id);s.enabled=v;localStorage.setItem('rhoda_v8_strats',JSON.stringify(strategies));runStrategies();}
function stopStrat(id){let s=strategies.find(x=>x.id===id);s.stopped=!s.stopped;localStorage.setItem('rhoda_v8_strats',JSON.stringify(strategies));renderMessages();runStrategies();}
function delStrat(id){if(!confirm('Delete?')) return;strategies=strategies.filter(x=>x.id!==id);localStorage.setItem('rhoda_v8_strats',JSON.stringify(strategies));renderMessages();runStrategies();}
function renderTrades(){let bal=history.reduce((a,b)=>a+(b.profit||0),0)+324.30,h=`<div class="qHeader"><span>Trade - Balance 324.30 - Equity</span></div><div class="card"><div style="display:flex;justify-content:space-between;font-size:12px"><span>Balance:</span><span>${bal.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;font-size:12px"><span>Equity:</span><span>${bal.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;font-size:12px"><span>Profit:</span><span style="color:${bal-324.30>=0?'#00e676':'#ff5252'}">${(bal-324.30).toFixed(2)}</span></div></div><div class="card"><h4>Open Positions - Trades Arena</h4><div id="tlist"></div></div><button class="btn gray" onclick="closePanel()" style="margin:10px">BACK TO CHART</button>`;document.getElementById('panel').innerHTML=h;document.getElementById('tlist').innerHTML=trades.slice(-50).reverse().map(t=>`<div style="padding:6px;border-bottom:1px solid #222;font-size:11px"><b style="color:${t.side==='BUY'?'#00e676':'#ff1744'}">${t.side} ${t.label}</b> ${t.name} @ ${t.price?.toFixed(2)} <button class="btn red" onclick="closeTrade(${t.time})">CLOSE</button></div>`).join('')||'No open positions - MT5 like';document.getElementById('tradeBal').textContent=bal.toFixed(2);}
function closeTrade(time){let p=prompt('Enter profit/loss 5.20 or -2.40','0');if(p===null) return;p=parseFloat(p);let h=history.find(x=>x.time===time);if(h){h.profit=p;h.status=p>=0?'win':'loss';}trades=trades.filter(x=>x.time!==time);localStorage.setItem('rhoda_v8_trades',JSON.stringify(trades));localStorage.setItem('rhoda_v8_history',JSON.stringify(history));renderTrades();}
function renderHistory(){let h=`<div class="qHeader"><span>History - All symbols - Profit, Deposit, Withdrawal, Balance</span></div><div class="card"><button class="btn" onclick="calcHist()">VIEW BY DAYS YOU SET</button><div id="perf" style="margin-top:8px;font-size:12px"></div></div><div class="card"><div id="hlist" style="max-height:60vh;overflow-y:auto"></div></div><button class="btn gray" onclick="closePanel()" style="margin:10px">BACK TO CHART</button>`;document.getElementById('panel').innerHTML=h;calcHist();}
function calcHist(){let filtered=history,profit=filtered.reduce((a,b)=>a+(b.profit||0),0),wins=filtered.filter(x=>x.profit>0).length,losses=filtered.filter(x=>x.profit<0).length;document.getElementById('perf').innerHTML=`Trades:${filtered.length} Wins:${wins} Losses:${losses} P/L:$${profit.toFixed(2)} - From MT5 video Profit, Deposit, Withdrawal, Balance`;document.getElementById('hlist').innerHTML=filtered.slice(-100).reverse().map(x=>`<div style="padding:6px;border-bottom:1px solid #222;font-size:11px"><div style="display:flex;justify-content:space-between"><b>${x.label||x.symbol} ${x.side}</b><span style="color:${x.profit>=0?'#00e676':'#ff5252'}">${x.profit>=0?'+':''}${x.profit||0}</span></div><div style="font-size:9px;color:#666">${new Date(x.time).toLocaleString()} ${x.name} ${x.status||''}</div></div>`).join('')||'No history - close trades to see here - History serves as history';}
let fibMode=false,fibPoints=[],fibLinesArr=[],hLines=[];
function toggleFib(){fibMode=!fibMode;showBanner(fibMode?'FIB ON - Tap 2 points on MAIN chart - 125% 75% etc':'FIB OFF');}
function addHLine(){let price=candles[candles.length-1]?.close;if(!price) return;let pl=candleSeries.createPriceLine({price:price,color:'#ffffff',title:'H Line '+price.toFixed(2),lineWidth:1,lineStyle:2});hLines.push(pl);showBanner('Horizontal Line at '+price.toFixed(2));}
function clearAllLines(){fibLinesArr.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});hLines.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});priceLines.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});fibLinesArr=[];hLines=[];priceLines=[];showBanner('All lines and fibs cleared');}
function resizeAll(){try{if(chartMain){chartMain.applyOptions({width:document.getElementById('cMain').clientWidth||window.innerWidth,height:document.getElementById('cMain').clientHeight||180});}if(chartVol){chartVol.applyOptions({width:document.getElementById('cVol').clientWidth||window.innerWidth,height:document.getElementById('cVol').clientHeight||60});}if(chartBulls){chartBulls.applyOptions({width:document.getElementById('cBulls').clientWidth||window.innerWidth,height:document.getElementById('cBulls').clientHeight||60});}if(chartMFI){chartMFI.applyOptions({width:document.getElementById('cMFI').clientWidth||window.innerWidth,height:document.getElementById('cMFI').clientHeight||60});}}catch{}}
window.addEventListener('resize',resizeAll);window.addEventListener('load',()=>{setTimeout(initCharts,500);});setTimeout(initCharts,800);if(Notification.permission!=='granted') Notification.requestPermission();
</script></body></html>
