 function updateMA(){let c=candles.map(x=>x.close),d20=[],d10=[];for(let i=0;i<c.length;i++){if(i>=19){let s=c.slice(i-19,i+1).reduce((a,b)=>a+b,0);d20.push({time:candles[i].time,value:s/20});}if(i>=9){let s=c.slice(i-9,i+1).reduce((a,b)=>a+b,0);d10.push({time:candles[i].time,value:s/10});}}ma20S.setData(d20);ma10S.setData(d10);let vData=candles.map(x=>({time:x.time,value:Math.abs(x.close-x.open)*2+1,color:x.close>=x.open?'#26a69a':'#ef5350'}));volS.setData(vData);let fData=candles.map((x,i)=>({time:x.time,value:30+Math.random()*50}));mfiS.setData(fData.slice(14));chartM.timeScale().fitContent();chartV.timeScale().fitContent();chartF.timeScale().fitContent();}
