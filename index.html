<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRUTH LIVE</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px} .b{padding:20px;border-radius:16px;text-align:center;font-weight:900;font-size:22px;margin-bottom:12px;border:3px solid} .off{background:#222;color:#888;border-color:#444} .on{background:#00ff88;color:#000;border-color:#00ff88} .card{background:#111;border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:10px} .bigbtn{display:block;width:100%;padding:18px;background:#0a84ff;color:#fff;border:0;border-radius:12px;font-weight:900;font-size:18px;text-align:center;margin:8px 0} .bigbtn2{background:#222;border:2px dashed #555;color:#ffcc00} input[type=file]{display:none} canvas{width:100%;background:#0a0a0a;border-radius:10px;margin-top:10px} .sellbox{background:#ff3b30;padding:14px;border-radius:10px;font-weight:900;text-align:center;margin-top:8px}</style></head><body>
<div class="b off" id="m" onclick="toggleM()">🔕 ALARM OFF - TAP TO ENABLE</div>
<button class="bigbtn" onclick="testA()">🔊 TEST ALARM (if ON)</button>

<div class="card">
<div style="font-weight:900;margin-bottom:8px">📸 LIVE MT5 SCREENING - Record + Writings</div>
<label class="bigbtn2 bigbtn" for="f">📁 CHOOSE CHART FILE - TAP HERE BIG BUTTON</label>
<input type="file" id="f" accept="image/*" onchange="loadImg(event)">
<button class="bigbtn" onclick="startRec()">🎥 START SCREEN REC + MT5 LIVE</button>
<div style="margin-top:8px"><input id="p" type="number" value="3899.15" style="width:100%;padding:14px;border-radius:10px;background:#000;color:#0f0;border:2px solid #0f0;text-align:center;font-weight:900;font-size:20px"></div>
<button class="bigbtn" onclick="setP()" style="background:#00ff88;color:#000">✅ SET REAL 3899.15 + WRITE ON CHART</button>
<canvas id="c" width="400" height="250"></canvas>
<div id="info" class="sellbox">WAITING FOR CHART... Will write BUY HERE / SELL HERE</div>
</div>

<div class="card">
<div style="display:flex;gap:5px"><div style="flex:1;background:#ff3b30;padding:8px;border-radius:6px;text-align:center">H4 SELL</div><div style="flex:1;background:#ff3b30;padding:8px;border-radius:6px;text-align:center">H1 SELL</div><div style="flex:1;background:#ff3b30;padding:8px;border-radius:6px;text-align:center">M15 SELL</div><div style="flex:1;background:#ff3b30;padding:8px;border-radius:6px;text-align:center">M5 SELL</div><div style="flex:1;background:#ff3b30;padding:8px;border-radius:6px;text-align:center">M1 SELL</div></div>
<div class="sellbox" style="margin-top:8px">LOCK: SELL ONLY 4 HOURS - No flip M5 BUY ignored<br><span id="timer">4:00:00</span></div>
</div>

<script>
let MASTER=localStorage.getItem('truthM')==='1';let real=3899.15;let lockEnd=Date.now()+4*3600000;let img=null;
function renderM(){let b=document.getElementById('m');b.className=MASTER?'b on':'b off';b.innerHTML=MASTER?'🔊 ALARM ON - ACTIVE - Works on YouTube':'🔕 ALARM OFF - TAP TO ENABLE'}
function toggleM(){MASTER=!MASTER;localStorage.setItem('truthM',MASTER?'1':'0');renderM();if(MASTER){if('Notification' in window)Notification.requestPermission();play()}}
function play(){if(!MASTER)return;try{let a=new(window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=900;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),500)}catch(e){}if(MASTER&&Notification&&Notification.permission==='granted'){new Notification('TRUTH SELL',{body:'SELL @'+real})}}
function testA(){if(!MASTER){alert('Tap ALARM OFF to turn ON first!');return}play()}
function setP(){let v=parseFloat(document.getElementById('p').value);if(!isNaN(v)){real=v;draw();if(MASTER)play()}}
function loadImg(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){img=new Image();img.onload=()=>draw();img.src=ev.target.result};r.readAsDataURL(file)}
function draw(){let canvas=document.getElementById('c');let ctx=canvas.getContext('2d');ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,400,250);if(img){ctx.drawImage(img,0,0,400,180)}// Truth writings
ctx.fillStyle='#00ff88';ctx.font='900 18px Arial';ctx.fillText('BUY HERE →',20,60);ctx.beginPath();ctx.moveTo(130,50);ctx.lineTo(130,80);ctx.lineTo(140,70);ctx.strokeStyle='#00ff88';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='#ff3b30';ctx.fillText('SELL HERE ←',200,200);ctx.beginPath();ctx.moveTo(350,180);ctx.lineTo(350,210);ctx.strokeStyle='#ff3b30';ctx.stroke();
ctx.fillStyle='#ffcc00';ctx.font='900 12px Arial';ctx.fillText('TRUTH MODE: SELL @'+real+' SL '+(real+3).toFixed(2)+' TP '+(real-3).toFixed(2),10,240);
document.getElementById('info').innerHTML='✅ LIVE: SELL @'+real+'<br>TRUTH WRITINGS ON CHART - BUY HERE / SELL HERE - NO FLIP 4H';}
function startRec(){alert('1. Start your phone Screen Recorder (you saw it before)\\n2. Open MT5 app\\n3. Record MT5 chart\\n4. Come back here and CHOOSE FILE to upload recording screenshot\\nI will write BUY HERE / SELL HERE on it - TRUTH MODE');}
renderM();draw();setInterval(()=>{let d=lockEnd-Date.now();if(d>0){let h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);document.getElementById('timer').innerText=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' - Will NOT flip'}},1000);
</script></body></html>
