<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RHODA V10.1 FINAL - MULTI PAIR SELECT + COPY SYMBOL</title><script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}body{background:#000;color:#bbb;overflow:hidden;height:100vh;display:flex;flex-direction:column}#top{height:32px;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 6px;font-size:11px;gap:6px}#mainArea{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#000}.chartBox{position:relative;background:#000;border-bottom:1px solid #1a1a1a}#boxMain{height:46%}#boxVol{height:18%}#boxBulls{height:18%}#boxMFI{height:18%}#bottomNav{height:48px;background:#000;border-top:1px solid #222;display:flex}.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#666;cursor:pointer}.navBtn.active{color:#2196f3}.navBtn b{font-size:15px}#panel{position:absolute;inset:0;background:#000;z-index:30;display:none;overflow-y:auto;padding:0}#panel.open{display:block}.card{background:#111;border:1px solid #222;padding:10px;margin-bottom:1px}input,textarea,select{background:#111;border:1px solid #333;color:#ddd;padding:8px;border-radius:4px;width:100%;margin-top:5px;font-size:12px}.btn{background:#2196f3;color:#fff;border:none;padding:7px 12px;border-radius:4px;margin:3px 2px;font-size:11px;cursor:pointer}.btn.red{background:#c62828}.btn.green{background:#2e7d32}.btn.gray{background:#333}.btn.orange{background:#ff9800;color:#000;font-weight:700}.strategyRow{display:flex;align-items:center;gap:5px;padding:8px;background:#1a1a1a;border-bottom:1px solid #222;font-size:11px;flex-wrap:wrap}#watch{position:absolute;top:32px;left:0;bottom:48px;width:0;background:#000;border-right:1px solid #222;overflow-y:auto;transition:0.2s;z-index:20}#watch.open{width:170px}.watch-item{padding:8px;border-bottom:1px solid #111;font-size:11px;display:flex;justify-content:space-between;cursor:pointer}#alarmBanner{position:fixed;top:35px;left:10px;right:10px;background:#ff9800;color:#000;padding:12px;border-radius:8px;display:none;z-index:9999;text-align:center;font-weight:700}.qHeader{height:30px;background:#111;display:flex;align-items:center;padding:0 8px;font-size:11px;border-bottom:1px solid #222;gap:8px}.pairCheck{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.pairCheck label{display:flex;align-items:center;gap:4px;background:#1a1a1a;border:1px solid #333;padding:4px 8px;border-radius:12px;font-size:11px;cursor:pointer}.pairCheck input{width:auto}.codeBox{background:#0a0a0a;border:1px solid #ff9800;border-radius:6px;padding:8px;font-family:monospace;font-size:10px;color:#00e676;white-space:pre-wrap;overflow-x:auto;margin-top:6px}</style></head><body><div id="top"><span onclick="toggleWatch()" style="font-size:18px;cursor:pointer">☰</span><span id="symLabel" style="color:#fff;font-weight:700">BTC • M5 Bitcoin</span><span style="flex:1"></span><span id="alarmTop" style="color:#ff9800;font-size:10px">🔔 ON</span><span id="sleepTop" style="color:#00e676;font-size:10px">🔆 ON</span><span id="clock" style="color:#00e676;font-size:10px">--:--:--</span></div><div id="watch"></div><div id="alarmBanner"></div><div id="mainArea"><div class="chartBox" id="boxMain"><div id="cMain" style="width:100%;height:100%"></div></div><div class="chartBox" id="boxVol"><div id="cVol" style="width:100%;height:100%"></div></div><div class="chartBox" id="boxBulls"><div id="cBulls" style="width:100%;height:100%"></div></div><div class="chartBox" id="boxMFI"><div id="cMFI" style="width:100%;height:100%"></div></div></div><div id="panel"></div><div id="bottomNav"><div class="navBtn" onclick="showTab('quotes')"><b>⇅</b>Quotes</div><div class="navBtn active" id="navCharts" onclick="showTab('charts')"><b>📈</b>Charts</div><div class="navBtn" onclick="showTab('trades')"><b>💰</b><span id="tradeBal">324.30</span></div><div class="navBtn" onclick="showTab('history')"><b>🕘</b>History</div><div class="navBtn" id="navMessages" onclick="showTab('messages')"><b>✉️</b>Messages</div></div><script>setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString()},1000);let alarmOn=localStorage.getItem('rhoda_alarm')!=='false';let noSleepOn=localStorage.getItem('rhoda_nosleep')!=='false';let wakeLock=null;let noSleepEnabled=noSleepOn;function updateTopIcons(){document.getElementById('alarmTop').textContent=alarmOn?'🔔 ON':'🔕 OFF';document.getElementById('sleepTop').textContent=noSleepOn?'🔆 ON':'💤 OFF';}function toggleAlarm(){alarmOn=!alarmOn;localStorage.setItem('rhoda_alarm',alarmOn);updateTopIcons();if(document.getElementById('panel').classList.contains('open')) renderMessages();}function toggleNoSleep(){noSleepOn=!noSleepOn;noSleepEnabled=noSleepOn;localStorage.setItem('rhoda_nosleep',noSleepOn);updateTopIcons();if(noSleepOn) enableWakeLock();else if(wakeLock){wakeLock.release();wakeLock=null;}if(document.getElementById('panel').classList.contains('open')) renderMessages();}async function enableWakeLock(){if(!noSleepEnabled) return;try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch{}}document.addEventListener('visibilitychange',()=>{if(wakeLock!==null&&document.visibilityState==='visible'&&noSleepEnabled) enableWakeLock();});if(noSleepOn) enableWakeLock();setInterval(()=>{if(noSleepEnabled&&!wakeLock) enableWakeLock();},10000);updateTopIcons();function showBanner(t){let b=document.getElementById('alarmBanner');b.textContent=t;b.style.display='block';setTimeout(()=>b.style.display='none',6000);}function testAlarm(){let msg='🔔 TEST ALARM WORKING '+new Date().toLocaleTimeString()+' - Background ON, Screen Asleep allowed';showBanner(msg);if(navigator.vibrate) navigator.vibrate([500,100,500,100,800]);let a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');a.play().catch(()=>{});if(alarmOn&&Notification.permission==='granted'){new Notification('RHODA MT5 ALARM',{body:msg,requireInteraction:true});}else if(Notification.permission!=='granted') Notification.requestPermission();if(!alarmOn) alert('Alarm is OFF');}function makeChart(id,visible){let el=document.getElementById(id);let ch=LightweightCharts.createChart(el,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},timeScale:{visible:visible||false,borderColor:'#222'},rightPriceScale:{borderColor:'#222'},width:el.clientWidth,height:el.clientHeight});return ch;}let chartMain=makeChart('cMain',false);let chartVol=makeChart('cVol',false);let chartBulls=makeChart('cBulls',false);let chartMFI=makeChart('cMFI',true);let candleSeries=chartMain.addCandlestickSeries({upColor:'#00ff00',downColor:'#ff0000'});let ma7=chartMain.addLineSeries({color:'#ffff00',lineWidth:1});let ma25=chartMain.addLineSeries({color:'#ff00ff',lineWidth:1});let ma99=chartMain.addLineSeries({color:'#00ffff',lineWidth:1});let volSeries=chartVol.addHistogramSeries({color:'#26a69a'});let bullsSeries=chartBulls.addLineSeries({color:'#ff0000',lineWidth:1});let bearsSeries=chartBulls.addLineSeries({color:'#00ffff',lineWidth:1});let mfiSeries=chartMFI.addLineSeries({color:'#2979ff',lineWidth:1});let candles=[];let priceLines=[];let currentSymbol='cryBTCUSD';let currentLabel='BTC';const SYMBOL_MAP=[{label:'BTC',sym:'cryBTCUSD'},{label:'ETH',sym:'cryETHUSD'},{label:'XAUUSD',sym:'frxXAUUSD'},{label:'XAGUSD',sym:'frxXAGUSD'},{label:'EURUSD',sym:'frxEURUSD'},{label:'GBPUSD',sym:'frxGBPUSD'},{label:'VOL75',sym:'R_75'},{label:'BOOM500',sym:'BOOM500'},{label:'CRASH500',sym:'CRASH500'}];let watch=document.getElementById('watch');SYMBOL_MAP.forEach(s=>{let d=document.createElement('div');d.className='watch-item';d.innerHTML=`<div><b>${s.label}</b><div style="font-size:9px;color:#666">${s.sym}</div></div><div style="text-align:right;color:#ff5252" id="p_${s.sym}">--</div>`;d.onclick=()=>{currentSymbol=s.sym;currentLabel=s.label;document.getElementById('symLabel').textContent=s.label+' • M5 Bitcoin';subscribe();toggleWatch();showTab('charts');};watch.appendChild(d);});function toggleWatch(){watch.classList.toggle('open')}let ws=null;function calcEMA(data,period){let k=2/(period+1);let ema=[];let sum=0;for(let i=0;i<data.length;i++){if(i<period-1){sum+=data[i];ema.push(null);continue;}if(i===period-1){sum+=data[i];ema.push(sum/period);}else{ema.push(data[i]*k+ema[i-1]*(1-k));}}return ema;}function calcBullsBears(high,low,close,period){let ema=calcEMA(close,period);let bulls=[],bears=[];for(let i=0;i<close.length;i++){if(ema[i]===null){bulls.push(null);bears.push(null);}else{bulls.push(high[i]-ema[i]);bears.push(low[i]-ema[i]);}}return {bulls,bears};}function calcMFI(high,low,close,vol,period){let tp=[];for(let i=0;i<close.length;i++) tp.push((high[i]+low[i]+close[i])/3);let mf=[];for(let i=0;i<tp.length;i++) mf.push(tp[i]*(vol[i]||1));let mfi=[];for(let i=0;i<close.length;i++){if(i<period){mfi.push(null);continue;}let pos=0,neg=0;for(let j=i-period+1;j<=i;j++){if(j===0) continue;if(tp[j]>tp[j-1]) pos+=mf[j];else if(tp[j]<tp[j-1]) neg+=mf[j];}if(neg===0) mfi.push(100);else{let mr=pos/neg;mfi.push(100-(100/(1+mr)));}}return mfi;}function subscribe(){if(ws) ws.close();candles=[];candleSeries.setData([]);ma7.setData([]);ma25.setData([]);ma99.setData([]);volSeries.setData([]);bullsSeries.setData([]);bearsSeries.setData([]);mfiSeries.setData([]);ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:currentSymbol,adjust_start_time:1,count:300,end:'latest',granularity:300,style:'candles'}));ws.send(JSON.stringify({ticks:currentSymbol,subscribe:1}));};ws.onmessage=(e)=>{let data=JSON.parse(e.data);if(data.candles){candles=data.candles.map(c=>({time:c.epoch,open:c.open,high:c.high,low:c.low,close:c.close}));updateAll();}if(data.tick){let t=data.tick;let newClose=parseFloat(t.quote);let last=candles[candles.length-1];if(!last) return;let epoch=t.epoch-(t.epoch%300);let nc={time:epoch,open:last.open,high:Math.max(last.high,newClose),low:Math.min(last.low,newClose),close:newClose};if(nc.time===last.time) candles[candles.length-1]=nc;else{candles.push(nc);if(candles.length>300) candles.shift();}updateAll();let el=document.getElementById('p_'+t.symbol);if(el) el.textContent=newClose.toFixed(2);}};}function updateAll(){if(candles.length===0) return;candleSeries.setData(candles);let close=candles.map(c=>c.close),high=candles.map(c=>c.high),low=candles.map(c=>c.low);let e7=calcEMA(close,7),e25=calcEMA(close,25),e99=calcEMA(close,99);let d7=[],d25=[],d99=[];for(let i=0;i<candles.length;i++){if(e7[i]!==null) d7.push({time:candles[i].time,value:e7[i]});if(e25[i]!==null) d25.push({time:candles[i].time,value:e25[i]});if(e99[i]!==null) d99.push({time:candles[i].time,value:e99[i]});}ma7.setData(d7);ma25.setData(d25);ma99.setData(d99);let volData=candles.map(c=>({time:c.time,value:Math.abs(c.close-c.open)*1000+Math.random()*50,color:c.close>=c.open?'#00ff00':'#ff0000'}));volSeries.setData(volData);let bb=calcBullsBears(high,low,close,20);let bD=[],beD=[];for(let i=0;i<candles.length;i++){if(bb.bulls[i]!==null){bD.push({time:candles[i].time,value:bb.bulls[i]});beD.push({time:candles[i].time,value:bb.bears[i]});}}bullsSeries.setData(bD);bearsSeries.setData(beD);let mfi=calcMFI(high,low,close,volData.map(v=>v.value),14);let mD=[];for(let i=0;i<candles.length;i++){if(mfi[i]!==null) mD.push({time:candles[i].time,value:mfi[i]});}mfiSeries.setData(mD);chartMain.timeScale().fitContent();chartVol.timeScale().fitContent();chartBulls.timeScale().fitContent();chartMFI.timeScale().fitContent();document.getElementById('symLabel').textContent=currentLabel+' • M5 Bitcoin '+close[close.length-1].toFixed(2);runStrategies();}subscribe();let strategies=JSON.parse(localStorage.getItem('rhoda_v8_strats')||'[]');let trades=JSON.parse(localStorage.getItem('rhoda_v8_trades')||'[]');let history=JSON.parse(localStorage.getItem('rhoda_v8_history')||'[]');function triggerAlarm(name,side,sym){if(!alarmOn) return;showBanner(`🔔 ${side} ${sym} ${name} ${new Date().toLocaleTimeString()}`);if(navigator.vibrate) navigator.vibrate([600,150,600,150,800]);let a=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');a.play().catch(()=>{});if(Notification.permission==='granted'){new Notification(`RHODA MT5 ${side} ${sym}`,{body:name,requireInteraction:true});}}function runStrategies(){if(candles.length<30) return;priceLines.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});priceLines=[];let closes=candles.map(c=>c.close);let markers=[];strategies.filter(s=>s.enabled&&!s.stopped).forEach(s=>{if(s.pairs&&s.pairs.length>0&&!s.pairs.includes(currentSymbol)) return;try{let fn=new Function('candles',s.code+'; return typeof check==="function"? check(candles):{};');let res=fn(closes);if(res.levels){Object.entries(res.levels).forEach(([k,v])=>{if(typeof v==='number'){let pl=candleSeries.createPriceLine({price:v,color:s.color||'#ff9800',title:k+' '+s.name,lineWidth:1,lineStyle:2});priceLines.push(pl);}});}if(res.sl){let pl=candleSeries.createPriceLine({price:res.sl,color:'#f44336',title:'SL '+s.name,lineWidth:2});priceLines.push(pl);}if(res.tp){let pl=candleSeries.createPriceLine({price:res.tp,color:'#00e676',title:'TP '+s.name,lineWidth:2});priceLines.push(pl);}if(res.buy||res.sell){let side=res.buy?'BUY':'SELL';markers.push({time:candles[candles.length-1].time,position:res.buy?'belowBar':'aboveBar',color:res.buy?'#00e676':'#ff1744',shape:res.buy?'arrowUp':'arrowDown',text:side});let t={time:Date.now(),symbol:currentSymbol,label:currentLabel,name:s.name,side,price:closes[closes.length-1],sl:res.sl,tp:res.tp};trades.push(t);history.push({...t,profit:0,status:'open'});localStorage.setItem('rhoda_v8_trades',JSON.stringify(trades));localStorage.setItem('rhoda_v8_history',JSON.stringify(history));triggerAlarm(s.name,side,currentLabel);}}catch{}});if(markers.length) candleSeries.setMarkers(markers.slice(-50));}function showTab(tab){let p=document.getElementById('panel');document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));if(tab==='quotes'){p.classList.remove('open');toggleWatch();return;}if(tab==='charts'){p.classList.remove('open');document.getElementById('navCharts').classList.add('active');resizeAll();return;}p.classList.add('open');if(tab==='trades'){document.querySelectorAll('.navBtn')[2].classList.add('active');renderTrades();}if(tab==='history'){document.querySelectorAll('.navBtn')[3].classList.add('active');renderHistory();}if(tab==='messages'){document.getElementById('navMessages').classList.add('active');renderMessages();}}function closePanel(){document.getElementById('panel').classList.remove('open');document.getElementById('navCharts').classList.add('active');resizeAll();}function getSelectedPairs(){let checks=document.querySelectorAll('.pair-cb:checked');return Array.from(checks).map(c=>c.value);}function renderMessages(){let h=`
 <div class="qHeader"><span>Messages - Strategy, Alarm, No Sleep, Fibs, Lines - Multi Pair</span></div>

 </div>
 <div style="display:flex;gap:6px;margin-top:6px"><input id="sname" placeholder="Name e.g. BTC Bulls Bears 125 75"><input id="scolor" type="color" value="#ff9800" style="width:50px"></div>
 <button class="btn green" onclick="saveStrat()">SAVE STRATEGY (1000 max) WITH PAIRS</button>

function saveStrat(){

 document.getElementById('tradeBal').textContent=bal.toFixed(2);

function closeTrade(time){let p=prompt('Enter profit/loss','0');if(p===null) return;p=parseFloat(p);let h=history.find(x=>x.time===time);if(h){h.profit=p;h.status=p>=0?'win':'loss';}trades=trades.filter(x=>x.time!==time);localStorage.setItem('rhoda_v8_trades',JSON.stringify(trades));localStorage.setItem('rhoda_v8_history',JSON.stringify(history));renderTrades();}
function renderHistory(){
 let h=`<div class="qHeader"><span>History - All symbols</span></div>
 <div class="card"><div style="display:flex;gap:6px"><div>From <input type="date" id="fromD"></div><div>To <input type="date" id="toD"></div></div><button class="btn" onclick="calcHist()">VIEW BY DAYS</button><div id="perf" style="margin-top:8px;font-size:12px"></div></div>
 <div class="card"><div id="hlist" style="max-height:70vh;overflow-y:auto"></div></div><button class="btn gray" onclick="closePanel()" style="margin:10px">BACK</button>`;
 document.getElementById('panel').innerHTML=h;let f=new Date();f.setDate(f.getDate()-7);document.getElementById('fromD').valueAsDate=f;document.getElementById('toD').valueAsDate=new Date();calcHist();
}
function calcHist(){let f=document.getElementById('fromD');let t=document.getElementById('toD');let from=new Date(f.value).getTime();let to=new Date(t.value).getTime()+86400000;let filtered=history.filter(x=>x.time>=from&&x.time<=to);let profit=filtered.reduce((a,b)=>a+(b.profit||0),0);let wins=filtered.filter(x=>x.profit>0).length;let losses=filtered.filter(x=>x.profit<0).length;document.getElementById('perf').innerHTML=`From ${f.value} To ${t.value}<br>Trades:${filtered.length} Wins:${wins} Losses:${losses} P/L:$${profit.toFixed(2)}`;document.getElementById('hlist').innerHTML=filtered.slice(-100).reverse().map(x=>`<div style="padding:6px;border-bottom:1px solid #222;font-size:11px"><div style="display:flex;justify-content:space-between"><b>${x.label||x.symbol} ${x.side}</b><span style="color:${x.profit>=0?'#00e676':'#ff5252'}">${x.profit>=0?'+':''}${x.profit||0}</span></div><div style="font-size:9px;color:#666">${new Date(x.time).toLocaleString()} ${x.name}</div></div>`).join('')||'No history';}
let fibMode=false;let fibPoints=[];let fibLinesArr=[];let hLines=[];
function toggleFib(){fibMode=!fibMode;showBanner(fibMode?'FIB ON - Tap 2 points on MAIN chart':'FIB OFF');}
function addHLine(){let price=candles[candles.length-1]?.close;if(!price) return;let pl=candleSeries.createPriceLine({price:price,color:'#ffffff',title:'H Line '+price.toFixed(2),lineWidth:1,lineStyle:2});hLines.push(pl);showBanner('H Line at '+price.toFixed(2));}
function clearAllLines(){fibLinesArr.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});hLines.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});priceLines.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});fibLinesArr=[];hLines=[];priceLines=[];showBanner('All cleared');}
chartMain.subscribeClick((p)=>{if(!fibMode) return;if(!p.point) return;let price=candleSeries.coordinateToPrice(p.point.y);if(!price) return;fibPoints.push(price);if(fibPoints.length===2){let low=Math.min(fibPoints[0],fibPoints[1]);let high=Math.max(fibPoints[0],fibPoints[1]);let range=high-low;fibLinesArr.forEach(l=>{try{chartMain.removePriceLine(l)}catch{}});fibLinesArr=[];[0,0.236,0.382,0.5,0.618,0.75,1,1.25,1.5].forEach(lv=>{let pl=candleSeries.createPriceLine({price:low+range*lv,color:lv===0.382?'#ffeb3b':lv===0.75?'#4caf50':lv===1.25?'#ff9800':'#555',title:(lv*100).toFixed(1)+'%',lineWidth:lv===0.382||lv===0.75||lv===1.25?2:1,lineStyle:1});fibLinesArr.push(pl);});fibPoints=[];fibMode=false;showBanner('FIB drawn');}});
function resizeAll(){chartMain.applyOptions({width:document.getElementById('cMain').clientWidth,height:document.getElementById('cMain').clientHeight});chartVol.applyOptions({width:document.getElementById('cVol').clientWidth,height:document.getElementById('cVol').clientHeight});chartBulls.applyOptions({width:document.getElementById('cBulls').clientWidth,height:document.getElementById('cBulls').clientHeight});chartMFI.applyOptions({width:document.getElementById('cMFI').clientWidth,height:document.getElementById('cMFI').clientHeight});}
window.addEventListener('resize',resizeAll);
window.addEventListener('load',()=>setTimeout(resizeAll,500));
if(Notification.permission!=='granted') Notification.requestPermission();
</script></body></html>
